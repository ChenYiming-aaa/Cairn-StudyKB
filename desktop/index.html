<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cairn · 桌面壳验证</title>
<style>
  :root {
    --bg: #faf8f4; --fg: #2a2723; --muted: #7a736a; --line: #e4ded3; --ok: #2f7d4f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--fg);
    font: 15px/1.6 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  }
  main { width: 560px; padding: 32px 36px; background: #fff; border: 1px solid var(--line); border-radius: 10px; }
  h1 { margin: 0 0 4px; font-size: 20px; letter-spacing: .5px; }
  .sub { margin: 0 0 24px; color: var(--muted); font-size: 13px; }
  dl { margin: 0; display: grid; grid-template-columns: 104px 1fr; gap: 10px 16px; }
  dt { color: var(--muted); font-size: 13px; }
  dd { margin: 0; font-family: Consolas, "Cascadia Mono", monospace; font-size: 13px; word-break: break-all; }
  .ok { color: var(--ok); font-weight: 600; }
  footer { margin-top: 26px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>Cairn</h1>
  <p class="sub">Electron 空壳验证页 —— 由 file:// 直接加载，不经过 Vite</p>
  <dl>
    <dt>加载方式</dt><dd id="protocol">—</dd>
    <dt>页面地址</dt><dd id="url">—</dd>
    <dt>后端端口</dt><dd id="port">—</dd>
    <dt>后端版本</dt><dd id="version">—</dd>
    <dt>后端健康</dt><dd class="ok">ok（窗口是在握手通过后才建的）</dd>
  </dl>
  <footer>本页不发起任何网络请求；端口与版本由主进程经 URL 查询参数传入。</footer>
</main>
<script>
  const q = new URLSearchParams(location.search)
  document.getElementById('protocol').textContent = location.protocol + '（无 http 服务，直接读本地文件）'
  document.getElementById('url').textContent = decodeURI(location.href)
  document.getElementById('port').textContent = q.get('port') || '（未传）'
  document.getElementById('version').textContent = q.get('version') || '（未传）'
</script>
</body>
</html>
