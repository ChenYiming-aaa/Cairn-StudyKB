[project]
name = "cairn"
version = "0.3.0"
description = "Cairn · 个人学习知识库（后端）"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "markdown>=3.6,<4",
  "pygments>=2.18,<3",
  "python-dotenv>=1.0,<2",
  "trafilatura>=2.3.1",
  "yt-dlp>=2026.10.26",
  "faster-whisper>=1.2.1",
  # 浏览器渲染与站点登录（ADR-023）。可选能力但放主依赖，开箱即用；
  # 只驱动本机已装的 Edge/Chrome，不额外下载 Chromium
  "playwright>=1.40",
  # whisper 的繁简是逐段概率选择，同一条音频会混着出；识别后统一转简（ADR-025）。
  # 纯 Python 词表，无编译依赖
  "zhconv>=1.4.3",
  "sentence-transformers>=6.2.0",
  "sqlite-vec>=0.1.9",
  "bleach[css]>=6.4.0",
  # 文件上传（M9 T9.3）：FastAPI 解析 multipart 的硬前置，不在 fastapi 默认依赖里。
  # 纯 Python、约 40 KB，打包体积可忽略
  "python-multipart>=0.0.9,<1",
  "rapidocr>=3.10,<4",
  "pypdfium2>=4.30,<5",
  # 非 PDF 抽取（T9.7）：docx / pptx / xlsx 有可靠的结构化读取，不该渲染成图再识别。
  # 四个库都进主包（实测解包合计 16.2 MB，其中 lxml 8.6 MB 是 docx/pptx 的公共依赖），
  # 因为 Word/PPT/Excel 读不了就等于不支持办公资料
  "python-docx>=1.1,<2",
  "mammoth>=1.8,<2",
  "python-pptx>=1.0,<2",
  "openpyxl>=3.1,<4",
]

# 本地识别（T9.4 / ADR-035）只给 `cairn-ocr` 组件用，主程序一行都不 import。
# 放在主依赖里是为了**组件打包时能 collect 到**（`tools/build_components.py` 从
# 同一个 venv 取包）；主包由 `cairn-backend.spec` 的 `MONOLITH_HEAVY` 把
# `rapidocr` / `cv2` 整个排掉，所以应用体积不受影响（实测组件 118 MB / 解包 266 MB）。
# rapidocr 会带进 opencv-python-headless（41.8 MB）与 PIL，这是硬依赖、不能省。

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
