[project]
name = "cairn"
version = "0.1.0"
description = "Cairn · 个人学习知识库（后端）"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "markdown>=3.6,<4",
  "pygments>=2.18,<3",
  "python-dotenv>=1.0,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = false
