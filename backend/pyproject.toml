[project]
name = "cairn"
version = "0.2.1"
description = "Cairn · 个人学习知识库（后端）"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "markdown>=3.6,<4",
  "pygments>=2.18,<3",
  "python-dotenv>=1.0,<2",
  "trafilatura>=2.3.1",
  "yt-dlp>=2026.10.26",
  "faster-whisper>=1.2.1",
  # 浏览器渲染与站点登录（ADR-023）。可选能力但放主依赖，开箱即用；
  # 只驱动本机已装的 Edge/Chrome，不额外下载 Chromium
  "playwright>=1.40",
  # whisper 的繁简是逐段概率选择，同一条音频会混着出；识别后统一转简（ADR-025）。
  # 纯 Python 词表，无编译依赖
  "zhconv>=1.4.3",
  "sentence-transformers>=6.2.0",
  "sqlite-vec>=0.1.9",
  "bleach[css]>=6.4.0",
  # 文件上传（M9 T9.3）：FastAPI 解析 multipart 的硬前置，不在 fastapi 默认依赖里。
  # 纯 Python、约 40 KB，打包体积可忽略
  "python-multipart>=0.0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
